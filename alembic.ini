[alembic]
script_location = database/migrations
prepend_sys_path = .
path_separator = os

# The runtime sqlalchemy.url is set programmatically by backend/database.py
# (it varies per environment / per test). This placeholder is only used if
# Alembic's CLI is invoked directly outside the application.
sqlalchemy.url = sqlite:///data/opportunity_engine.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
